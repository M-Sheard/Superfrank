<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Superfrank</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f6fdf'/%3E%3Ctext x='8' y='12' text-anchor='middle' font-size='11' font-family='sans-serif' fill='white'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3c3126;
    --cream: #fff6ea;
    --paper: #fffaf2;
    --line: #e4c99a;
    --blue: #2f6fdf;
    --shadow: 0 8px 18px rgba(72, 46, 18, 0.14);
    --font: Nunito, "Trebuchet MS", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #efe2c4;
    color: var(--ink);
    font-family: var(--font);
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  button, p, h1, h2, h3, h4 { user-select: none; }
  #app {
    height: 100vh;
    height: 100dvh;
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--cream);
    overflow: hidden;
    position: relative;
  }
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
    background: var(--cream);
    border-bottom: 3px solid var(--line);
    box-shadow: 0 2px 0 rgba(255, 255, 255, 0.65) inset;
    z-index: 6;
    position: relative;
  }
  .titles { min-width: 0; flex: 1 1 auto; }
  h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: 0.01em;
  }
  #placeName {
    margin: 2px 0 0;
    font-size: 0.95rem;
    font-weight: 700;
    color: #6d5a45;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #placeName:empty { display: none; }
  #friendCount {
    margin: 1px 0 0;
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--ink);
    white-space: nowrap;
  }
  #mapBtn {
    flex: 0 0 auto;
    background: var(--paper);
    color: var(--ink);
    border: 3px solid var(--line);
    border-radius: 999px;
    padding: 10px 14px;
    min-height: 44px;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }
  #mapSheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    top: 64px;
    z-index: 5;
    background: rgba(36, 48, 28, 0.4);
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
  }
  #mapSheet .sheet { overflow-x: hidden; overflow-y: auto; max-width: 100%; }
  #mapCanvas {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    border-radius: 12px;
    background: #d5e4b0;
  }
  #placeBtn {
    flex: 0 0 auto;
    background: var(--paper);
    color: var(--ink);
    border: 3px solid var(--line);
    border-radius: 999px;
    padding: 10px 12px;
    min-height: 44px;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }
  #placeBtn[aria-pressed="true"] { background: #ffe3a4; }
  #journalBtn, #muteBtn, #mapBtn, #placeBtn, #journalBack, #mapBack, #listen, #choices button, .dpad button, #resetJournal, .titleCard button {
    font-family: var(--font);
    box-shadow: 0 2px 0 rgba(255, 255, 255, 0.45) inset, 0 3px 0 rgba(90, 60, 24, 0.12);
  }
  #journalBtn {
    flex: 0 0 auto;
    background: var(--blue);
    color: white;
    border: 0;
    border-radius: 999px;
    padding: 10px 16px;
    min-height: 44px;
    font: inherit;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
  }
  #muteBtn {
    flex: 0 0 auto;
    background: var(--paper);
    color: var(--ink);
    border: 3px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    min-height: 44px;
    font: inherit;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
  }
  #journalBtn:focus-visible, #muteBtn:focus-visible, .dpad button:focus-visible, #journalBack:focus-visible, #titleScreen button:focus-visible {
    outline: 3px solid #1d4eaf;
    outline-offset: 2px;
  }
  #stage {
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    position: relative;
    overflow: hidden;
    background: #6db34a;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    -webkit-touch-callout: none;
    user-select: none;
  }
  #placeList {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 5;
    width: 138px;
    max-height: 46%;
    overflow-y: auto;
    background: rgba(255, 246, 234, 0.94);
    border: 2px solid #4a3018;
    border-radius: 12px;
    padding: 6px;
    touch-action: pan-y;
  }
  #placeList[hidden] { display: none; }
  #placeList p {
    margin: 0 0 4px;
    font-size: 0.75rem;
    font-weight: 800;
  }
  #placeList button {
    display: block;
    width: 100%;
    text-align: left;
    margin: 2px 0;
    padding: 6px 8px;
    min-height: 32px;
    border-radius: 8px;
    border: 1px solid #e4c99a;
    background: #fffaf2;
    font: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--ink);
  }
  #placeList button.on { background: #ffe3a4; }
  #placeZoom {
    position: absolute;
    left: 8px;
    bottom: 8px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #placeZoom[hidden] { display: none; }
  #placeZoom button {
    min-height: 44px;
    min-width: 108px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 2px solid #4a3018;
    background: rgba(255, 246, 234, 0.94);
    font: inherit;
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--ink);
    touch-action: manipulation;
  }
  #controls {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    background: var(--cream);
    border-top: 3px solid var(--line);
    box-shadow: 0 -2px 0 rgba(255, 255, 255, 0.6) inset;
    z-index: 2;
    touch-action: none;
  }
  .dpad {
    display: grid;
    grid-template-columns: 64px 64px 64px;
    grid-template-areas:
      ". up ."
      "left down right";
    gap: 8px;
    touch-action: none;
    -webkit-touch-callout: none;
    user-select: none;
  }
  .dpad button {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    border: 3px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-size: 1.35rem;
    font-weight: 800;
    cursor: pointer;
    touch-action: none;
    -webkit-touch-callout: none;
    user-select: none;
    padding: 0;
  }
  .dpad button.on, .dpad button:active { background: #ffe3a4; }
  .dpad [data-dir="up"] { grid-area: up; }
  .dpad [data-dir="down"] { grid-area: down; }
  .dpad [data-dir="left"] { grid-area: left; }
  .dpad [data-dir="right"] { grid-area: right; }
  #hint {
    margin: 0;
    font-weight: 700;
    color: #6d5a45;
    line-height: 1.25;
    text-align: right;
    min-width: 0;
  }
  .meet {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;
    z-index: 3;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 28px),
      var(--paper);
    border: 3px solid var(--line);
    border-radius: 22px;
    padding: 12px 14px 14px;
    box-shadow: var(--shadow);
    max-height: 70%;
    overflow-x: hidden;
    overflow-y: auto;
    touch-action: pan-y;
  }
  .meet p { margin: 0; }
  #meetTag {
    color: #b47b12;
    font-weight: 700;
    font-size: 0.95rem;
  }
  #meetTag.cheer { color: #2d7a32; }
  #meetTag.again { color: #a15a3a; }
  #meetName {
    margin: 0 0 4px;
    font-size: clamp(1.25rem, 5vw, 1.7rem);
    font-weight: 800;
    line-height: 1.15;
  }
  #meetAsk {
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.3;
    margin: 2px 0 8px;
  }
  #meetAsk:empty, #meetFact:empty, #meetTag:empty, #meetWord:empty, #slots:empty, #choices:empty { display: none; }
  #listen {
    display: block;
    width: 100%;
    max-width: 100%;
    min-height: 52px;
    margin: 0 0 8px;
    border: 0;
    border-radius: 14px;
    background: var(--blue);
    color: white;
    font: inherit;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }
  #meetWord {
    margin: 2px 0 4px;
    text-align: center;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.14em;
  }
  #pips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
    margin: 0 0 8px;
    max-width: 100%;
  }
  #pips:empty { display: none; }
  #pips i {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: block;
    flex: 0 0 auto;
  }
  #pips i.gone { opacity: 0.28; }
  #pips .gap { width: 12px; height: 16px; flex: 0 0 auto; }
  #slots {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin: 0 0 8px;
    max-width: 100%;
  }
  .slot {
    width: clamp(28px, 8.2vw, 48px);
    height: clamp(36px, 10vw, 52px);
    border: 3px solid var(--line);
    border-radius: 12px;
    background: #fffdf8;
    box-shadow: 0 2px 0 rgba(180, 140, 70, 0.18);
    font-size: clamp(1rem, 4vw, 1.5rem);
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  #choices {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 100%;
  }
  #choices button {
    flex: 1 1 64px;
    max-width: 76px;
    min-height: 52px;
    border-radius: 16px;
    border: 3px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font: inherit;
    font-size: 1.45rem;
    font-weight: 800;
    cursor: pointer;
    touch-action: manipulation;
    padding: 6px 4px;
  }
  #choices button:disabled { opacity: 0.35; }
  #choices button.undo {
    flex: 1 1 120px;
    max-width: 140px;
    font-size: 1.15rem;
    background: #fff3d6;
  }
  #choices button.ready {
    flex: 1 1 100%;
    max-width: none;
    min-height: 52px;
    background: var(--blue);
    color: white;
    border: 0;
    font-size: 1.2rem;
  }
  #meetFact {
    font-size: 1.05rem;
    line-height: 1.35;
    margin-top: 6px;
  }
  #journal {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    top: 64px;
    z-index: 5;
    background: rgba(36, 48, 28, 0.4);
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 12px;
  }
  [hidden] { display: none !important; }
  .sheet {
    width: min(460px, 100%);
    max-height: 100%;
    overflow: auto;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0) 36px),
      var(--paper);
    border: 3px solid var(--line);
    border-radius: 22px;
    padding: 14px 14px 18px;
    box-shadow: var(--shadow);
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }
  .sheetHead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    position: sticky;
    top: -14px;
    background: var(--paper);
    padding-bottom: 8px;
  }
  .sheetHead h2 { margin: 0; font-size: 1.5rem; font-weight: 800; }
  #journalBack, #mapBack {
    font: inherit;
    font-weight: 700;
    border: 0;
    background: var(--blue);
    color: white;
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .lead { margin: 4px 0 8px; font-weight: 700; font-size: 1.05rem; }
  #journalBody h3 {
    margin: 14px 0 6px;
    font-size: 0.95rem;
    color: #7a6248;
  }
  #journalBody article {
    background: #fffdf8;
    border: 2px solid #f0e2c4;
    border-radius: 16px;
    padding: 8px 10px;
    margin: 8px 0;
    box-shadow: 0 3px 0 rgba(180, 140, 70, 0.12);
  }
  #journalBody h4 { margin: 0; font-size: 1.12rem; }
  #journalBody article p { margin: 3px 0 0; line-height: 1.35; }
  .guide {
    display: flex;
    gap: 10px;
    align-items: center;
    min-width: 0;
  }
  .guide .text { min-width: 0; flex: 1 1 auto; }
  .guide img, .guide .blank {
    width: 72px;
    height: 72px;
    flex: 0 0 auto;
    border-radius: 12px;
    background: #f6f1e6;
    object-fit: contain;
  }
  .guide img.ghost {
    opacity: 0.24;
    filter: grayscale(1) contrast(0.8);
    background: transparent;
  }
  .guide .blank { border: 2px dashed #d9c7a4; }
  .stamp, .placeStamp {
    display: inline-block;
    margin-left: 6px;
    border: 2px solid #2d7a32;
    color: #2d7a32;
    font-weight: 700;
    font-size: 0.78rem;
    line-height: 1.2;
    border-radius: 999px;
    padding: 1px 7px;
    transform: rotate(-8deg);
  }
  .none { margin: 0 0 4px; color: #8a7764; }
  .dev {
    margin-top: 18px;
    border-top: 2px solid var(--line);
    padding-top: 6px;
    max-width: 100%;
  }
  .dev summary {
    cursor: pointer;
    font-weight: 700;
    color: #8a7764;
    font-size: 0.95rem;
    padding: 12px 2px;
    min-height: 44px;
  }
  #resetJournal {
    display: block;
    width: 100%;
    max-width: 100%;
    margin: 8px 0 4px;
    min-height: 52px;
    font: inherit;
    font-weight: 700;
    font-size: 1.1rem;
    border-radius: 14px;
    border: 3px solid #e0cfae;
    background: white;
    color: var(--ink);
    cursor: pointer;
  }
  #titleScreen {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 76px 16px 20px;
    align-items: flex-end;
    background: #cfe6b0;
    overflow-x: hidden;
    overflow-y: auto;
  }
  #titleBackdrop {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }
  #titleScreen[hidden] { display: none !important; }
  .titleCard {
    position: relative;
    z-index: 1;
    width: min(420px, 100%);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    min-height: 0;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0) 42px),
      var(--paper);
    border: 3px solid var(--line);
    border-radius: 28px;
    padding: 18px 16px 16px;
    box-shadow: var(--shadow);
  }
  .titleCard h2 {
    margin: 0;
    flex: 0 0 auto;
    font-size: clamp(2rem, 8vw, 3rem);
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  .titleCard img {
    flex: 1 1 auto;
    min-height: 0;
    width: auto;
    max-width: 70%;
    max-height: min(24svh, 200px);
    object-fit: contain;
  }
  .parentControl {
    width: 100%;
    flex: 0 0 auto;
  }
  .parentControl summary {
    cursor: pointer;
    text-align: center;
    font-weight: 700;
    color: #8a7764;
    font-size: 0.95rem;
    padding: 4px 2px 2px;
    list-style: none;
  }
  .parentControl summary::-webkit-details-marker { display: none; }
  .titleCard button {
    flex: 0 0 auto;
    width: 100%;
    min-height: 52px;
    border: 0;
    border-radius: 16px;
    background: var(--blue);
    color: white;
    font: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    cursor: pointer;
  }
  #continueGame {
    background: var(--paper);
    color: var(--ink);
    border: 3px solid var(--line);
  }
  #continueGame:disabled { opacity: 0.45; cursor: default; }
  @media (max-width: 380px) {
    .dpad { grid-template-columns: 58px 58px 58px; gap: 6px; }
    .dpad button { width: 58px; height: 58px; }
    h1 { font-size: 1.15rem; }
    #hint { font-size: 0.85rem; }
    #journalBtn, #muteBtn, #placeBtn { padding-left: 10px; padding-right: 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="titles">
      <h1>Superfrank</h1>
      <p id="placeName"></p>
      <p id="friendCount" hidden>0 of 24.</p>
    </div>
    <button type="button" id="placeBtn" aria-pressed="false">Place</button>
    <button type="button" id="muteBtn" aria-pressed="false">Sound</button>
    <button type="button" id="mapBtn" hidden>Map</button>
    <button type="button" id="journalBtn" aria-expanded="false" aria-controls="journal">Journal</button>
  </header>
  <div id="stage">
    <canvas id="game" width="390" height="400"></canvas>
    <div id="placeList" hidden></div>
    <div id="placeZoom" hidden>
      <button type="button" id="zoomIn">Zoom in</button>
      <button type="button" id="zoomOut">Zoom out</button>
      <button type="button" id="zoomFit">Whole map</button>
    </div>
    <div id="meet" class="meet" hidden>
      <p id="meetTag"></p>
      <h2 id="meetName"></h2>
      <p id="meetAsk"></p>
      <div id="pips"></div>
      <button type="button" id="listen" hidden>Listen</button>
      <p id="meetWord"></p>
      <div id="slots"></div>
      <div id="choices"></div>
      <p id="meetFact"></p>
    </div>
  </div>
  <div id="controls">
    <div class="dpad" id="dpad">
      <button type="button" data-dir="up" aria-label="Walk up">▲</button>
      <button type="button" data-dir="left" aria-label="Walk left">◀</button>
      <button type="button" data-dir="down" aria-label="Walk down">▼</button>
      <button type="button" data-dir="right" aria-label="Walk right">▶</button>
    </div>
    <p id="hint">Hold the grass<br>Arrows or WASD</p>
  </div>
  <div id="titleScreen">
    <img id="titleBackdrop" src="img/title-backdrop.webp" alt="">
    <div class="titleCard">
      <h2>Superfrank</h2>
      <img src="img/frank.png" alt="Frank">
      <button type="button" id="newGame">New game</button>
      <button type="button" id="continueGame">Continue</button>
      <details class="parentControl" id="parentControl">
        <summary>Parent</summary>
        <button type="button" id="resetJournal">Reset</button>
      </details>
    </div>
  </div>
  <div id="mapSheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mapTitle">
      <div class="sheetHead">
        <h2 id="mapTitle">Map</h2>
        <button type="button" id="mapBack">Close</button>
      </div>
      <canvas id="mapCanvas" width="320" height="240"></canvas>
    </div>
  </div>
  <div id="journal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="journalTitle">
      <div class="sheetHead">
        <h2 id="journalTitle">Journal</h2>
        <button type="button" id="journalBack">Back</button>
      </div>
      <div id="journalBody"></div>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";

  var SAVE = "superfrank-save-v2";
  var SAVE_SEEN = "superfrank-seen-v1";
  var MUTE_KEY = "superfrank-mute";
  var PATH_Y = 460;
  var GATE_Y0 = 390;
  var GATE_Y1 = 530;
  var SPEED = 210;

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var stage = document.getElementById("stage");
  var placeName = document.getElementById("placeName");
  var journalBtn = document.getElementById("journalBtn");
  var journal = document.getElementById("journal");
  var journalBody = document.getElementById("journalBody");
  var journalBack = document.getElementById("journalBack");
  var meet = document.getElementById("meet");
  var meetTag = document.getElementById("meetTag");
  var meetName = document.getElementById("meetName");
  var meetAsk = document.getElementById("meetAsk");
  var listenBtn = document.getElementById("listen");

  var placeMode = /(?:\?|&)place=1(?:&|$)/.test(location.search);

  var placeBtn = document.getElementById("placeBtn");
  var placeZoomBox = document.getElementById("placeZoom");
  var placeZoom = 1;
  var pinch = null;
  function baseCam(area) {
    var sc = (1152 / 1200) * 0.9;
    var fit = Math.min(viewW / area.w, viewH / area.h);
    if (sc <= fit) sc = fit * 1.12;
    return { sc: sc, fit: fit };
  }

  function minPlaceZoom() {
    var cam = baseCam(areaNow());
    if (!cam.sc || !cam.fit) return 0.2;
    return Math.max(0.05, (cam.fit * 0.98) / cam.sc);
  }

  function setPlaceZoom(z) {
    placeZoom = clamp(z, minPlaceZoom(), 2.5);
  }

  function touchSpan(touches) {
    if (!touches || touches.length < 2) return 0;
    return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
  }

  function saveFriendPlace(c) {
    var x = Math.round(c.x);
    var y = Math.round(c.y);
    c.x = x;
    c.y = y;
    fetch("/save-friend", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: c.id, x: x, y: y })
    }).then(function (res) {
      if (!res.ok) throw new Error("save");
      setPlaceNote(c.name + " is saved in the game.");
    }).catch(function () {
      setPlaceNote(c.name + " is on the screen only. Use the local game so the place is saved in the game file.");
    });
  }

  function friendAtWorld(wx, wy) {
    var best = null;
    var bestD = 110;
    areaNow().creatures.forEach(function (c) {
      var body = Math.hypot(c.x - wx, (c.y - c.h * 0.45) - wy);
      var feet = Math.hypot(c.x - wx, c.y - wy);
      var d = body < feet ? body : feet;
      if (d < bestD) { best = c; bestD = d; }
    });
    return best;
  }

  function friendAtClient(clientX, clientY) {
    var w = worldFromClient(clientX, clientY);
    var best = null;
    var bestD = 1e9;
    areaNow().creatures.forEach(function (c) {
      var ih = c.h;
      var iw = ih;
      var img = imgs[c.img];
      if (img && img.naturalWidth) iw = img.naturalWidth / img.naturalHeight * ih;
      var left = c.x - iw / 2 - 28;
      var right = c.x + iw / 2 + 28;
      var top = c.y - ih - 28;
      var bot = c.y + 28;
      var cx = w.x < left ? left : w.x > right ? right : w.x;
      var cy = w.y < top ? top : w.y > bot ? bot : w.y;
      var d = Math.hypot(w.x - cx, w.y - cy);
      if (d < 8 && d < bestD) { best = c; bestD = d; }
    });
    return best;
  }

  function setPlaceNote(text) {
    var note = document.getElementById("placeNote");
    if (note) note.textContent = text;
  }

  function renderPlaceList() {

    title.textContent = "Drag a friend, then let go. That place is saved in the game.";
    placeList.appendChild(title);
    var note = document.createElement("p");
    note.id = "placeNote";
    note.textContent = "Each place is written into the game file.";
    placeList.appendChild(note);
    areaNow().creatures.forEach(function (c) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = c.name;
      if (placeDrag && placeDrag.c === c) btn.className = "on";
      btn.addEventListener("pointerdown", function (e) {
        if (e.button && e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        beginFriendDrag(e, c);
      });
      placeList.appendChild(btn);
    });
  }

  function setPlaceMode(on) {
    placeMode = !!on;
    if (placeBtn) placeBtn.setAttribute("aria-pressed", placeMode ? "true" : "false");
    if (!placeMode) {
      placeZoom = 1;
      placeDrag = null;
      pinch = null;
    }
    if (placeList) placeList.hidden = !placeMode;
    if (placeZoomBox) placeZoomBox.hidden = !placeMode;
    if (placeMode) {
      meet.hidden = true;
      renderPlaceList();
    }

  if (placeZoomBox) {
    document.getElementById("zoomIn").addEventListener("click", function () {

    document.getElementById("zoomOut").addEventListener("click", function () {

  }
  if (placeBtn) {
    placeBtn.addEventListener("click", function () { setPlaceMode(!placeMode); });
  }
  setPlaceMode(placeMode);

  function worldFromClient(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var sx = (clientX - rect.left) * (viewW / Math.max(1, rect.width));
    var sy = (clientY - rect.top) * (viewH / Math.max(1, rect.height));
    var area = areaNow();
    if (area.plate) {
      var cam = wildCam(area);
      return { x: (sx - cam.ox) / cam.sc, y: (sy - cam.oy) / cam.sc };
    }
    return { x: sx + camX, y: sy + camY };
  }

  var downPointers = {};

  function beginFriendDrag(e, creature) {
    placeDrag = { id: e.pointerId, c: creature };
    finger = null;
    pinch = null;
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  }

  function moveFriendTo(clientX, clientY) {
    if (!placeDrag) return;
    var spot = worldFromClient(clientX, clientY);
    var area = areaNow();
    placeDrag.c.x = clamp(spot.x, 36, area.w - 36);
    placeDrag.c.y = clamp(spot.y, 36, area.h - 36);
  }

  function finishFriendDrag() {
    if (!placeDrag) return;
    var friend = placeDrag.c;
    placeDrag = null;
    renderPlaceList();
    saveFriendPlace(friend);
  }

  function pinchSpan() {
    var pts = [];
    Object.keys(downPointers).forEach(function (k) { pts.push(downPointers[k]); });
    if (pts.length < 2) return 0;
    return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  }

  stage.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (e.target.closest && e.target.closest("#placeList, #placeZoom")) return;
    if (playLocked() || padTouch != null) return;
    if (e.target !== canvas) return;
    e.preventDefault();
    downPointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    if (placeMode && Object.keys(downPointers).length >= 2) {
      if (placeDrag) finishFriendDrag();
      finger = null;
      pinch = { d: pinchSpan(), z: placeZoom };
      return;
    }
    if (pinch) return;
    if (placeMode) {
      var hit = friendAtClient(e.clientX, e.clientY);
      if (hit) {
        beginFriendDrag(e, hit);
        return;
      }
    }
    var w = worldFromClient(e.clientX, e.clientY);
    finger = { id: e.pointerId, x: w.x, y: w.y };
  });
  stage.addEventListener("pointermove", function (e) {
    if (!downPointers[e.pointerId] && !(placeDrag && placeDrag.id === e.pointerId)) return;
    if (downPointers[e.pointerId]) downPointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (placeMode && pinch && Object.keys(downPointers).length >= 2) {
      var span = pinchSpan();
      if (pinch.d > 12) setPlaceZoom(pinch.z * (span / pinch.d));
      return;
    }
    if (placeDrag && e.pointerId === placeDrag.id) {

  function resize() {

  function pathClear(area) {
    var list = mainCreatures(area);
    var i;

    }

  function forwardLimit(area) {
    var list = mainCreatures(area);
    var i;

  function hits(x, y) {
    var area = areaNow();
    if (area.solids && area.solids.length) {
      var n;
      for (n = 0; n < area.solids.length; n++) {
        if (ellipseHit(area.solids[n], x, y)) return true;
      }
      return false;
    }
    var blocks = area.blocks;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.pond) continue;
      var dx = x - b.x;
      var dy = y - b.y;
      var rr = b.r + 16;
      if (dx * dx + dy * dy < rr * rr) return true;
    }
    if (area.corridors && area.corridors.length && !insideMaze(area, x, y)) return true;
    return false;
  }

  function nearest() {
    var list = areaNow().creatures;
    var best = null;
    var bestD = 1e9;
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      var d = Math.hypot(c.x - player.x, c.y - player.y);
      var need = 76 + c.h * 0.12;
      if (d < need && d < bestD) {
        best = c;
        bestD = d;
      }
    }
    return best;
  }

  var quiz = null;

  function shuffle(list) {
    var a = list.slice();
    var i;
    for (i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function paintPips(q) {
    pipsEl.replaceChildren();
    if (!q || !q.pips) return;
    var groups = q.pips.groups;
    var gone = q.pips.gone || 0;
    var total = 0;
    var g;
    for (g = 0; g < groups.length; g++) total += groups[g];
    var n = 0;
    for (g = 0; g < groups.length; g++) {
      if (g) {
        var gap = document.createElement("span");
        gap.className = "gap";
        pipsEl.appendChild(gap);
      }
      var i;
      for (i = 0; i < groups[g]; i++) {
        n += 1;
        var dot = document.createElement("i");
        dot.style.background = q.pips.color || "#e35d4f";
        if (gone && n > total - gone) dot.className = "gone";
        pipsEl.appendChild(dot);
      }
    }
  }

    var q = QUIZ[c.id];
    var spelled = cheer && q && q.kind === "spell" ? q.word : "";
    clearQuizBits();
    setTag(cheer ? "Yes!" : "Hello", cheer ? "cheer" : "");
    meetName.textContent = c.name;
    meetAsk.textContent = cheer ? "Nice work." : "";
    meetWord.textContent = spelled;
    meetFact.textContent = c.fact;
    meet.hidden = false;
  }

  function gbVoice() {
    var synth = window.speechSynthesis;
    if (!synth || !synth.getVoices) return null;
    var voices = synth.getVoices() || [];
    var i;
    for (i = 0; i < voices.length; i++) {
      var lang = String(voices[i].lang || "").toLowerCase();
      if (lang === "en-gb" || lang.indexOf("en-gb") === 0) return voices[i];
    }
    return null;
  }

  function speakLine(text, rate) {
    var synth = window.speechSynthesis;
    if (!synth || !text) return;
    synth.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-GB";
    utter.rate = rate || 0.9;
    utter.pitch = 1;
    var voice = gbVoice();
    if (voice) utter.voice = voice;
    synth.speak(utter);
  }

  function speakWord(word) {
    speakLine(word, 0.62);
  }

  function shuffledLetters(q) {
    var a = shuffle(q.letters);
    var guard = 0;
    while (a.slice(0, q.word.length).join("") === q.word && guard < 8) {
      a = shuffle(q.letters);
      guard += 1;
    }
    return a;
  }

  function paintSlots() {
    var nodes = slotsEl.children;
    var i;
    for (i = 0; i < nodes.length; i++) nodes[i].textContent = quiz.slots[i] || "";
  }

    ORDER.forEach(function (id) {

    });

    showHello(c, true);

        c.clearing = null;
        grantFriend(c);

    });

  function undoLetter() {
    if (!quiz || !quiz.slots || !quiz.slots.length) return;
    var letter = quiz.slots.pop();
    paintSlots();
    var buttons = choicesEl.querySelectorAll("button[data-letter]");
    var i;
    for (i = 0; i < buttons.length; i++) {
      if (buttons[i].disabled && buttons[i].getAttribute("data-letter") === letter) {
        buttons[i].disabled = false;
        break;
      }
    }
  }

  function pickLetter(c, btn) {
    if (!quiz || quiz.id !== c.id || quiz.slots.length >= quiz.word.length) return;
    var letter = btn.getAttribute("data-letter");
    quiz.slots.push(letter);
    btn.disabled = true;
    paintSlots();
    if (quiz.slots.length < quiz.word.length) return;
    if (quiz.slots.join("") === quiz.word) {
      finishFriend(c);
      return;
    }
    setTag("Try again.", "again");
    quiz.slots = [];
    paintSlots();
    var buttons = choicesEl.querySelectorAll("button[data-letter]");
    var i;
    for (i = 0; i < buttons.length; i++) buttons[i].disabled = false;
  }

  function pickNumber(c, n) {
    var q = QUIZ[c.id];
    if (n === q.answer) {
      finishFriend(c);
      return;
    }
    setTag("Try again.", "again");
  }

  function showQuizPlay(c) {
    var q = QUIZ[c.id];
    clearQuizBits();
    setTag("", "");
    meetName.textContent = q.kind === "spell" ? "New friend" : c.name;
    meetAsk.textContent = q.kind === "spell" ? q.job : q.prompt;
    meetWord.textContent = "";
    meetFact.textContent = "";
    paintPips(q);
    if (q.kind === "spell") {
      quiz = { id: c.id, phase: "play", word: q.word, slots: [] };
      listenBtn.hidden = false;
      listenBtn.onclick = function () { speakWord(q.say || q.word); };
      var s;
      for (s = 0; s < q.word.length; s++) {
        var slot = document.createElement("div");
        slot.className = "slot";
        slotsEl.appendChild(slot);
      }
      shuffledLetters(q).forEach(function (letter) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = letter;
        btn.setAttribute("data-letter", letter);
        btn.addEventListener("click", function () { pickLetter(c, btn); });
        choicesEl.appendChild(btn);
      });
      var undo = document.createElement("button");
      undo.type = "button";
      undo.className = "undo";
      undo.textContent = "Undo";
      undo.addEventListener("click", undoLetter);
      choicesEl.appendChild(undo);
    } else {
      quiz = { id: c.id, phase: "play" };
      q.choices.forEach(function (n) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = String(n);
        btn.addEventListener("click", function () { pickNumber(c, n); });
        choicesEl.appendChild(btn);
      });
    }
    meet.hidden = false;
  }

    clearQuizBits();
    setTag("", "");
    meetName.textContent = q.kind === "spell" ? "New friend" : c.name;
    meetAsk.textContent = q.job;

  function sayShutDoor(area) {
    var museumExit = null;
    if (area.exits) {
      area.exits.forEach(function (ex) { if (ex.to === "museum") museumExit = ex; });
    }
    var doorY0 = museumExit ? museumExit.y0 : GATE_Y0;
    var doorY1 = museumExit ? museumExit.y1 : GATE_Y1;
    var atDoor = area.id === "hollow" && !cape && !capeDone && player.x > area.w - 70 && player.y > doorY0 && player.y < doorY1;
    if (!atDoor) {
      if (shownId === "shut-door") {
        meet.hidden = true;
        shownId = null;
      }
      return;
    }
    if (shownId === "shut-door" && !meet.hidden) return;
    clearQuizBits();
    setTag("", "");
    meetName.textContent = "The shy one is still hiding.";

    meetFact.textContent = "";

  function updateMeet() {
    if (placeMode) {
      meet.hidden = true;
      notice = null;
      return;
    }
    if (journalOpen || mapOpen) {
      meet.hidden = true;
      return;
    }
    if (endingOn) return;
    if (cheerUntil && performance.now() < cheerUntil) return;
    var c = nearest();
    if (!c) {
      if (shownId === "shut-door") return;
      meet.hidden = true;
      shownId = null;
      quiz = null;
      notice = null;
      greeted = null;
      return;
    }
    if (c.clearing) {
      if (shownId !== c.id || meet.hidden) showHello(c, true);
      shownId = c.id;
      return;
    }
    if (!seen.has(c.id)) {
      if (notice && notice.id === c.id) return;
      if (greeted === c.id) {
        if (shownId === c.id && !meet.hidden) return;
        showQuestion(c);
        return;
      }
      notice = { id: c.id, t: 0 };
      showNotice(c);
      return;
    }
    notice = null;
    greeted = null;
    if (shownId === c.id && !meet.hidden) return;
    shownId = c.id;
    showHello(c, false);
  }

  function renderMap() {
    var area = areaNow();
    var dprMap = Math.min(2, window.devicePixelRatio || 1);
    mapCanvas.style.width = "100%";
    var cssW = mapCanvas.clientWidth;
    if (cssW < 80) cssW = Math.min(420, window.innerWidth - 48);
    var scale = cssW / area.w;
    var cssH = Math.max(120, Math.round(area.h * scale));
    mapCanvas.style.height = cssH + "px";
    mapCanvas.width = Math.max(1, Math.round(cssW * dprMap));
    mapCanvas.height = Math.max(1, Math.round(cssH * dprMap));
    var g = mapCanvas.getContext("2d");
    g.setTransform(dprMap, 0, 0, dprMap, 0, 0);
    g.clearRect(0, 0, cssW, cssH);
    g.fillStyle = area.ground || "#c5d6a0";
    g.fillRect(0, 0, cssW, cssH);
    function sx(x) { return x * scale; }
    function sy(y) { return y * scale; }
    var plate = area.plate && imgs[area.plate];
    if (plate && plate.naturalWidth) {
      g.drawImage(plate, 0, 0, cssW, cssH);
    }
    if (!(plate && plate.naturalWidth)) {
      var rects = area.corridors && area.corridors.length ? area.corridors : [{ x: 0, y: 0, w: area.w, h: area.h }];
      g.fillStyle = "#6b4a2a";
      rects.forEach(function (r) {
        g.beginPath();
        g.roundRect(sx(r.x), sy(r.y), Math.max(1, r.w * scale), Math.max(1, r.h * scale), 3);
        g.fill();
      });
      g.fillStyle = area.path || "#e2c088";
      rects.forEach(function (r) {
        var inset = 2;
        g.beginPath();
        g.roundRect(sx(r.x) + inset, sy(r.y) + inset, Math.max(1, r.w * scale - inset * 2), Math.max(1, r.h * scale - inset * 2), 2);
        g.fill();
      });
    }
    g.font = "800 12px Nunito, Trebuchet MS, sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillStyle = "#3c3126";
    area.exits.forEach(function (ex) {
      var title = SIGN[ex.to] || ex.to;
      var label = title;
      var x;
      var y;
      if (ex.side === "east") {
        label = title + " →";
        y = sy((ex.y0 + ex.y1) / 2);
        x = cssW - 8 - g.measureText(label).width / 2;
      } else if (ex.side === "west") {
        label = "← " + title;
        y = sy((ex.y0 + ex.y1) / 2);
        x = 8 + g.measureText(label).width / 2;
      } else if (ex.side === "north") {
        label = title + " ↑";
        x = sx((ex.x0 + ex.x1) / 2);
        y = 14;
      } else {
        label = title + " ↓";
        x = sx((ex.x0 + ex.x1) / 2);
        y = cssH - 14;
      }
      g.fillText(label, x, y);
    });
    var px = sx(player.x);
    var py = sy(player.y);
    g.fillStyle = "#d23b32";
    g.beginPath();
    g.arc(px, py, 5, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = "#fff6ea";
    g.lineWidth = 2;
    g.stroke();
    g.fillStyle = "#3c3126";
    g.font = "800 11px Nunito, Trebuchet MS, sans-serif";
    var here = "you are here";
    var lx = px;
    var ly = py - 14;
    if (ly < 12) ly = py + 14;
    var hw = g.measureText(here).width / 2;
    if (lx < hw + 4) lx = hw + 4;
    if (lx > cssW - hw - 4) lx = cssW - hw - 4;
    g.fillText(here, lx, ly);
  }

  function strokePath(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }

  function flower(x, y, color, s) {
    ctx.fillStyle = color;
    var i;
    for (i = 0; i < 5; i++) {
      var a = (i / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * 5 * s, y + Math.sin(a) * 5 * s, 3.1 * s, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#ffe27a";
    ctx.beginPath();
    ctx.arc(x, y, 2.3 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function tuft(x, y, s, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x - 4 * s, y - 8 * s, x - 7 * s, y - 14 * s);
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + 1 * s, y - 10 * s, x, y - 16 * s);
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + 4 * s, y - 8 * s, x + 7 * s, y - 13 * s);
    ctx.stroke();
  }

  function hash(n) {
    var x = Math.sin(n * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }

  function blob(cx, cy, rx, ry, seed, lobes) {
    var n = lobes || 8;
    var i;
    ctx.beginPath();
    for (i = 0; i <= n; i++) {
      var a = (i / n) * Math.PI * 2;
      var wob = 0.78 + hash(seed + i * 2.3) * 0.36;
      var x = cx + Math.cos(a) * rx * wob;
      var y = cy + Math.sin(a) * ry * wob;
      if (i === 0) ctx.moveTo(x, y);
      else {
        var am = ((i - 0.5) / n) * Math.PI * 2;
        var wm = 0.7 + hash(seed + i * 4.1) * 0.45;
        ctx.quadraticCurveTo(cx + Math.cos(am) * rx * wm, cy + Math.sin(am) * ry * wm, x, y);
      }
    }
    ctx.closePath();
  }

  function bush(b) {
    var r = b.r;
    var s = b.x * 0.17 + b.y * 0.13;
    ctx.fillStyle = "rgba(48, 32, 16, 0.2)";
    blob(b.x, b.y + r * 0.4, r * 0.72, r * 0.2, s, 7);
    ctx.fill();
    var lumps = [
      [0.04, 0.02, 0.58, 0.46, "#1c5a28"],
      [-0.28, -0.06, 0.4, 0.34, "#2f7a34"],
      [0.26, 0.0, 0.38, 0.32, "#246b30"],
      [-0.06, -0.28, 0.44, 0.32, "#3d9144"],
      [0.16, -0.22, 0.3, 0.24, "#67b85a"]
    ];
    var i;
    for (i = 0; i < lumps.length; i++) {
      var L = lumps[i];
      ctx.fillStyle = L[4];
      blob(b.x + r * L[0], b.y + r * L[1], r * L[2], r * L[3], s + i * 9, 7);
      ctx.fill();
    }
    ctx.strokeStyle = "rgba(18, 58, 24, 0.4)";
    ctx.lineWidth = Math.max(1.5, r * 0.045);
    ctx.lineCap = "round";
    var k;
    for (k = 0; k < 4; k++) {
      ctx.beginPath();
      ctx.moveTo(b.x + (hash(s + k) - 0.5) * r * 0.4, b.y + r * 0.05);
      ctx.quadraticCurveTo(
        b.x + (hash(s + k + 2) - 0.5) * r * 0.7,
        b.y - r * 0.35,
        b.x + (hash(s + k + 5) - 0.5) * r * 0.55,
        b.y - r * 0.58
      );
      ctx.stroke();
    }
  }

  function drawPond(b) {
    var r = b.r + 14;
    var s = b.x * 0.05 + b.y;
    ctx.fillStyle = "rgba(40, 30, 16, 0.16)";
    blob(b.x + 4, b.y + 8, r + 8, r * 0.5, s, 9);
    ctx.fill();
    ctx.fillStyle = "#b88958";
    blob(b.x, b.y, r + 12, r * 0.72, s + 2, 10);
    ctx.fill();
    ctx.fillStyle = "#c4a06a";
    blob(b.x - 2, b.y - 2, r + 4, r * 0.6, s + 3, 9);
    ctx.fill();
    var water = ctx.createLinearGradient(b.x, b.y - r, b.x, b.y + r);
    water.addColorStop(0, "#9ed8ea");
    water.addColorStop(0.55, "#3e8eb0");
    water.addColorStop(1, "#2a6e90");
    ctx.fillStyle = water;
    blob(b.x, b.y, r - 2, (r - 2) * 0.62, s + 6, 10);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x - r * 0.35, b.y - r * 0.08);
    ctx.quadraticCurveTo(b.x - r * 0.05, b.y - r * 0.22, b.x + r * 0.2, b.y - r * 0.04);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath();
    ctx.moveTo(b.x - r * 0.1, b.y + r * 0.16);
    ctx.quadraticCurveTo(b.x + r * 0.15, b.y + r * 0.02, b.x + r * 0.32, b.y + r * 0.18);
    ctx.stroke();
    ctx.fillStyle = "#2f7a34";
    blob(b.x + r * 0.28, b.y + r * 0.08, 14, 9, s + 11, 6);
    ctx.fill();
    ctx.fillStyle = "#67b85a";
    blob(b.x + r * 0.22, b.y + r * 0.02, 8, 5, s + 12, 5);
    ctx.fill();
    ctx.fillStyle = "#f4b6d0";
    blob(b.x + r * 0.3, b.y + r * 0.1, 4, 3, s + 13, 5);
    ctx.fill();
  }

  function drawTree(x, y, s) {
    ctx.fillStyle = "rgba(40, 28, 12, 0.25)";
    ctx.beginPath();
    ctx.ellipse(x, y + 10 * s, 16 * s, 5 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#6b4424";
    ctx.fillRect(x - 4 * s, y - 4 * s, 8 * s, 18 * s);
    ctx.fillStyle = "#8d5a34";
    ctx.fillRect(x - 3 * s, y - 2 * s, 3 * s, 14 * s);
    ctx.fillStyle = "#145c28";
    blob(x, y - 16 * s, 18 * s, 14 * s, x + y, 7);
    ctx.fill();
    ctx.fillStyle = "#1e6a30";
    blob(x - 8 * s, y - 12 * s, 12 * s, 10 * s, x, 6);
    ctx.fill();
    ctx.fillStyle = "#3d9144";
    blob(x + 7 * s, y - 18 * s, 10 * s, 8 * s, y, 6);
    ctx.fill();
  }

  function drawRock(x, y, s) {
    var seed = x * 0.2 + y;
    ctx.fillStyle = "rgba(48, 32, 16, 0.2)";
    blob(x, y + 8 * s, 16 * s, 6 * s, seed, 6);
    ctx.fill();
    ctx.fillStyle = "#7a5840";
    blob(x + 2 * s, y + 3 * s, 18 * s, 13 * s, seed + 1, 7);
    ctx.fill();
    ctx.fillStyle = "#c6a27c";
    blob(x - 1 * s, y - 1 * s, 14 * s, 9 * s, seed + 2, 7);
    ctx.fill();
    ctx.fillStyle = "#f0d8bc";
    blob(x - 5 * s, y - 4 * s, 6 * s, 3.5 * s, seed + 3, 5);
    ctx.fill();
    ctx.strokeStyle = "rgba(90, 58, 36, 0.45)";
    ctx.lineWidth = Math.max(1, 1.5 * s);
    ctx.beginPath();
    ctx.moveTo(x - 6 * s, y + 2 * s);
    ctx.quadraticCurveTo(x, y + 6 * s, x + 8 * s, y + 1 * s);
    ctx.stroke();
  }

  function drawFern(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = "rgba(30, 24, 12, 0.16)";
    blob(2, 8, 12, 4, x + y, 6);
    ctx.fill();
    function frond(ang, len, color) {
      ctx.save();
      ctx.rotate(ang);
      ctx.strokeStyle = "#1d4a24";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(len * 0.2, -len * 0.7, 0, -len);
      ctx.stroke();
      ctx.fillStyle = color;
      var i;
      for (i = 1; i <= 4; i++) {
        var yy = -len * (i / 5);
        blob(-5, yy, 6, 3, x + i + ang * 5, 5);
        ctx.fill();
        blob(5, yy - 2, 6, 3, y + i + ang * 3, 5);
        ctx.fill();
      }
      ctx.fillStyle = "#b7e2a4";
      blob(-2, -len + 2, 3, 2, x + ang, 4);
      ctx.fill();
      ctx.restore();
    }
    frond(-0.7, 22, "#1f5c28");
    frond(0.05, 28, "#2f7a34");
    frond(0.75, 22, "#3f8f46");
    ctx.restore();
  }

  function drawPrint(x, y, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = "rgba(120, 78, 40, 0.28)";
    ctx.beginPath();
    ctx.ellipse(0, 2, 8, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    var i;
    for (i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.ellipse(i * 7, -10, 3.2, 4.2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function wildCam(area) {
    // 90% of the 140px framing, so Frank is about 126px and a bit more ground shows.
    var sc = baseCam(area).sc;
    if (placeMode) sc = sc * placeZoom;
    var worldW = viewW / sc;
    var worldH = viewH / sc;
    var camXw = 0;
    var camYw = 0;
    var ox = 0;
    var oy = 0;
    if (area.w * sc <= viewW) ox = (viewW - area.w * sc) / 2;
    else {
      camXw = clamp(player.x - worldW / 2, 0, area.w - worldW);
      ox = -camXw * sc;
    }
    if (area.h * sc <= viewH) oy = (viewH - area.h * sc) / 2;
    else {
      camYw = clamp(player.y - worldH / 2, 0, area.h - worldH);
      oy = -camYw * sc;
    }
    return { sc: sc, camX: camXw, camY: camYw, ox: ox, oy: oy };
  }

  function drawWoodSign(x, y, label, fontPx) {

        y = (i * 22) % 140;
        g.beginPath();
        g.moveTo(x, y);
        g.quadraticCurveTo(x + 8, y - 6, x + 4, y - 14);
        g.stroke();
      }
    } else if (kind === "hollow") {
      g.fillStyle = "#ddb87a";
      g.fillRect(0, 0, 140, 140);
      for (i = 0; i < 12; i++) {
        g.fillStyle = i % 2 ? "rgba(110, 74, 36, 0.28)" : "rgba(255, 236, 200, 0.4)";
        g.beginPath();
        g.ellipse((i * 37) % 140, (i * 19) % 140, 5, 3, i, 0, Math.PI * 2);
        g.fill();
      }
    } else {
      var base = kind === "meadow" ? "#b7c85a" : kind === "safari" ? "#c9b15a" : "#62b244";
      g.fillStyle = base;
      g.fillRect(0, 0, 140, 140);
      for (i = 0; i < 8; i++) {
        g.fillStyle = i % 2 ? "rgba(255,255,220,0.16)" : "rgba(30,70,20,0.12)";
        g.beginPath();
        g.ellipse((i * 44) % 140, (i * 31) % 140, 16, 9, i * 0.5, 0, Math.PI * 2);
        g.fill();
      }
      for (i = 0; i < 26; i++) {
        x = (i * 29) % 140;
        y = (i * 41) % 140;
        g.strokeStyle = i % 3 ? "rgba(24, 78, 28, 0.45)" : "rgba(210, 230, 120, 0.55)";
        g.lineWidth = 1.6;
        g.beginPath();
        g.moveTo(x, y);
        g.quadraticCurveTo(x + 2, y - 8, x - 1, y - 13);
        g.stroke();
      }
    }
    groundPats[kind] = ctx.createPattern(c, "repeat");
    return groundPats[kind];
  }

  var speckPat = null;
  function speckPattern() {
    if (speckPat) return speckPat;
    var c = document.createElement("canvas");
    c.width = 48;
    c.height = 48;
    var g = c.getContext("2d");
    var i;
    for (i = 0; i < 10; i++) {
      g.fillStyle = i % 2 ? "rgba(255,255,255,0.16)" : "rgba(70,48,20,0.08)";
      g.fillRect((i * 13) % 48, (i * 19) % 48, 2, 2);
    }
    speckPat = ctx.createPattern(c, "repeat");
    return speckPat;
  }

  function vergeColor(kind) {
    if (kind === "desert") return "#6aaa45";
    if (kind === "jungle") return "#145c28";
    if (kind === "hollow") return "#c4a46a";
    if (kind === "safari") return "#8aaa48";
    if (kind === "meadow") return "#7aaa3a";
    return "#3f8f3a";
  }

  function expandLane(lane, pad) {
    if (lane.horiz) return { x: lane.x, y: lane.y - pad, w: lane.w, h: lane.h + pad * 2 };
    return { x: lane.x - pad, y: lane.y, w: lane.w + pad * 2, h: lane.h };
  }

  function fillRound(rect, radius) {
    ctx.beginPath();
    ctx.roundRect(rect.x, rect.y, rect.w, rect.h, radius);
    ctx.fill();
  }


  function drawHabitat(h) {
    var x = h.x + 78;
    var y = h.y + 72;
    if (!nearView(x, y, 160)) return;
    ctx.save();
    ctx.globalAlpha = 0.42;
    ctx.fillStyle = h.wash || "#efe6b0";
    blob(x + 30, y + 18, 92, 54, h.x * 0.02, 8);
    ctx.fill();
    ctx.restore();
    var i;
    if (h.kind === "flowers") {
      for (i = 0; i < 10; i++) flower(x + (i % 5) * 28, y + ((i / 5) | 0) * 28, h.color, 1.25);
    } else if (h.kind === "pond") {
      drawPond({ x: x + 16, y: y + 10, r: 46 });
    } else if (h.kind === "rocks") {
      drawRock(x, y, 1.3);
      drawRock(x + 48, y + 16, 1.05);
      drawRock(x + 20, y + 38, 0.8);
    } else if (h.kind === "ferns") {
      drawFern(x, y, 1.25);
      drawFern(x + 42, y + 8, 1.05);
      drawFern(x + 18, y + 36, 0.9);
    } else if (h.kind === "bones") {
      ctx.fillStyle = "#f4ead4";
      ctx.save();
      ctx.translate(x + 10, y + 8);
      ctx.rotate(0.5);
      ctx.beginPath();
      ctx.ellipse(0, 0, 22, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.rotate(-1.2);
      ctx.beginPath();
      ctx.ellipse(18, 6, 16, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (h.kind === "nest") {
      ctx.fillStyle = "#a97444";
      ctx.beginPath();
      ctx.ellipse(x + 8, y + 10, 36, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#6b4424";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x - 6, y + 8, 14, 0.2, 2.6);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x + 22, y + 12, 13, 0.7, 3.3);
      ctx.stroke();
    } else {
      tuft(x, y, 1.45, h.color || "#6a9a32");
      tuft(x + 30, y + 8, 1.2, h.color || "#6a9a32");
      tuft(x + 14, y + 28, 1.35, h.color || "#6a9a32");
      tuft(x + 46, y + 26, 1.1, h.color || "#6a9a32");
    }
  }

  function drawBarrierRuns(area) {
    var rock = area.kind === "hollow" || area.kind === "desert";
    var runs = area.barriers || [];
    var i;
    for (i = 0; i < runs.length; i++) {
      var run = runs[i];
      var reach = 32;
      var bite = 18;
      var x;
      var y;
      var w;
      var h;
      if (run.horiz) {
        x = run.a0;
        w = Math.max(8, run.a1 - run.a0);
        if (run.outward < 0) { y = run.fixed - reach; h = reach + bite; }
        else { y = run.fixed - bite; h = reach + bite; }
      } else {
        y = run.a0;
        h = Math.max(8, run.a1 - run.a0);
        if (run.outward < 0) { x = run.fixed - reach; w = reach + bite; }
        else { x = run.fixed - bite; w = reach + bite; }
      }
      if (x + w < camX - 30 || x > camX + viewW + 30 || y + h < camY - 30 || y > camY + viewH + 30) continue;
      ctx.fillStyle = rock ? "#6d4c34" : "#174e22";
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 8);
      ctx.fill();
      ctx.fillStyle = rock ? "#c6a27c" : (area.kind === "jungle" ? "#1e6a30" : "#2f7a34");
      ctx.beginPath();
      ctx.roundRect(x + 3, y + 3, Math.max(4, w - 6), Math.max(4, h - 6), 6);
      ctx.fill();
      ctx.fillStyle = rock ? "#a07850" : "#145c28";
      ctx.beginPath();
      ctx.arc(run.horiz ? run.a0 : run.fixed, run.horiz ? run.fixed : run.a0, 16, 0, Math.PI * 2);
      ctx.arc(run.horiz ? run.a1 : run.fixed, run.horiz ? run.fixed : run.a1, 16, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawMaze(area) {
    if (!area.corridors || !area.corridors.length) return;
    var rects = [];
    area.corridors.forEach(function (r) {
      if (r.x + r.w < camX - 40 || r.x > camX + viewW + 40 || r.y + r.h < camY - 40 || r.y > camY + viewH + 40) return;
      rects.push(r);
    });
    ctx.fillStyle = "#6b4a2a";
    rects.forEach(function (r) { fillRound(r, 10); });
    ctx.fillStyle = area.path || "#e2c088";
    rects.forEach(function (r) {
      fillRound({ x: r.x + 5, y: r.y + 5, w: Math.max(4, r.w - 10), h: Math.max(4, r.h - 10) }, 8);
    });
    ctx.fillStyle = area.pathIn || "#f6e4b8";
    rects.forEach(function (r) {
      fillRound({ x: r.x + 12, y: r.y + 12, w: Math.max(4, r.w - 24), h: Math.max(4, r.h - 24) }, 6);
    });
  }

  function nearView(x, y, pad) {
    return x >= camX - pad && x <= camX + viewW + pad && y >= camY - pad && y <= camY + viewH + pad;
  }

  function drawWild(area, time) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = area.ground;
    ctx.fillRect(0, 0, viewW, viewH);
    var cam = wildCam(area);
    ctx.setTransform(dpr * cam.sc, 0, 0, dpr * cam.sc, dpr * cam.ox, dpr * cam.oy);
    camX = cam.camX;
    camY = cam.camY;
    var plate = imgs[area.plate];
    if (plate && plate.naturalWidth) ctx.drawImage(plate, 0, 0, area.w, area.h);
    if (area.id === "hollow" && area.trail) {
      var ti;
      for (ti = 0; ti < area.trail.length; ti++) drawPrint(area.trail[ti][0], area.trail[ti][1], 0);
    }
    (area.blooms || []).forEach(function (b) {
      if (!picked.has(b.id)) flower(b.x, b.y, b.color, 1.6);
    });
    var moving = !!cape || hasDir("up") || hasDir("down") || hasDir("left") || hasDir("right");
    var items = [];
    area.creatures.forEach(function (c) {
      items.push({ y: shownSpot(c).y, draw: function () { drawCreature(c, time); } });
    });
    items.push({
      y: player.y,
      draw: function () {
        drawFrank(player.x, player.y, player.facing, player.phase, moving, time);
      }
    });
    items.sort(function (a, b) { return a.y - b.y; });
    items.forEach(function (item) { item.draw(); });
    area.signs.forEach(drawSign);
  }

  function drawWorld(time) {
    var area = areaNow();
    if (area.plate) {
      drawWild(area, time);
      return;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = area.ground;
    ctx.fillRect(0, 0, viewW, viewH);
    var maxX = Math.max(0, area.w - viewW);
    var maxY = Math.max(0, area.h - viewH);
    var tx = clamp(player.x - viewW / 2, 0, maxX);
    var ty = clamp(player.y - viewH / 2, 0, maxY);
    camX = tx;
    camY = ty;
    ctx.translate(-camX, -camY);
    if (area.kind === "museum") {
      drawMuseumRoom(time);
      return;
    }

    var groundTex = groundPattern(area.kind);
    if (groundTex) {
      ctx.fillStyle = groundTex;
      ctx.fillRect(0, 0, area.w, area.h);
    }
    ctx.fillStyle = area.groundAlt;
    ctx.globalAlpha = 0.28;
    area.blobs.forEach(function (p) {
      blob(p.x, p.y, p.rx, p.ry, p.x * 0.01 + p.y, 9);
      ctx.fill();
    });
    if (area.kind === "desert") {
      ctx.strokeStyle = "rgba(176, 122, 62, 0.35)";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      var dune;
      for (dune = 0; dune < 6; dune++) {
        var dx = 90 + dune * 180;
        var dy = 180 + (dune % 3) * 220;
        ctx.beginPath();
        ctx.moveTo(dx, dy);
        ctx.quadraticCurveTo(dx + 70, dy - 36, dx + 150, dy + 8);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    if (area.kind === "garden") {
      ctx.fillStyle = "#c4a06a";
      var row;
      for (row = 0; row < 3; row++) {
        ctx.beginPath();
        ctx.roundRect(250, 620 + row * 28, 130, 16, 6);
        ctx.fill();
        ctx.fillStyle = "#3d9a40";
        var k;
        for (k = 0; k < 5; k++) {
          blob(268 + k * 24, 624 + row * 28, 9, 6, 40 + row * 5 + k, 6);
          ctx.fill();
          ctx.fillStyle = "#67b85a";
          blob(266 + k * 24, 621 + row * 28, 5, 3, 80 + k, 5);
          ctx.fill();
          ctx.fillStyle = "#3d9a40";
        }
        ctx.fillStyle = "#c4a06a";
      }
    }

    area.tufts.forEach(function (t) { if (nearView(t.x, t.y, 40)) tuft(t.x, t.y, t.s, area.tuft); });
    area.flowers.forEach(function (f) { if (nearView(f.x, f.y, 30)) flower(f.x, f.y, f.c, f.s); });
    area.extras.forEach(function (e) {
      if (!nearView(e.x, e.y, 50)) return;
      if (e.k === "rock") drawRock(e.x, e.y, e.s);
      else if (e.k === "fern") drawFern(e.x, e.y, e.s);
      else drawPrint(e.x, e.y, e.rot);
    });

    drawMaze(area);
    drawBarrierRuns(area);
    (area.habitats || []).forEach(drawHabitat);
    if (area.id === "hollow") drawPteroTrail();
    (area.blooms || []).forEach(function (b) {
      if (picked.has(b.id) || !nearView(b.x, b.y, 40)) return;
      flower(b.x, b.y, b.color, 1.35);
    });
    area.blocks.forEach(function (b) { if (b.pond) drawPond(b); });

    var moving = !!cape || hasDir("up") || hasDir("down") || hasDir("left") || hasDir("right");
    var items = [];
    area.bushes.forEach(function (b) {
      if (!nearView(b.x, b.y, 80)) return;
      items.push({ y: b.y, draw: function () { bush(b); } });
    });
    (area.walls || []).forEach(function (w) {
      if (!nearView(w.x, w.y, 80)) return;
      items.push({
        y: w.y,
        draw: function () {
          if (w.k === "rock") drawRock(w.x, w.y, w.s);
          else if (w.k === "tree") drawTree(w.x, w.y, w.s);
          else if (w.k === "fern") drawFern(w.x, w.y, w.s);
          else bush({ x: w.x, y: w.y, r: w.r });
        }
      });
    });
    area.creatures.forEach(function (c) {
      items.push({ y: shownSpot(c).y, draw: function () { drawCreature(c, time); } });
    });
    area.exits.forEach(function (ex) {
      var foot = (ex.side === "north" || ex.side === "south") ? 176 : PATH_Y + LANE / 2;
      items.push({ y: foot, draw: function () { drawGate(ex, area); } });
    });
    items.push({
      y: player.y,
      draw: function () {
        drawFrank(player.x, player.y, player.facing, player.phase, moving, time);
      }
    });
    items.sort(function (a, b) { return a.y - b.y; });
    items.forEach(function (item) { item.draw(); });
    area.signs.forEach(drawSign);
  }

  function tickMotions(dt) {
    ORDER.forEach(function (id) {
      AREAS[id].creatures.forEach(function (c) {
        if (c.hop) {
          c.hop.t += dt;
          if (c.hop.t >= c.hop.dur) c.hop = null;
        }
        if (c.wave) {
          c.wave.t += dt;
          if (c.wave.t >= c.wave.dur) c.wave = null;
        }
      });
    });
    if (notice) {
      notice.t += dt;
      var near = nearest();
      if (!near || near.id !== notice.id || seen.has(notice.id)) notice = null;
      else if (notice.t >= 0.85) {
        var who = near;
        notice = null;
        greeted = who.id;
        showQuestion(who);
      }
    }
    if (cheerUntil && performance.now() > cheerUntil) {
      cheerUntil = 0;
      if (shownId === "medal") {
        meet.hidden = true;
        shownId = null;
      }
    }
  }

  function update(dt) {
    if (titleOn) return;
    tickMotions(dt);
    tickClears(dt);
    if (gateWalk) {
      gateWalk.t += dt;
      stepAcc += dt;
      if (stepAcc > 0.36) {
        stepAcc = 0;
        playFoot();
      }
      if (gateWalk.t >= gateWalk.dur) {
        var ex = gateWalk.ex;
        gateWalk = null;
        arrive(ex);
      }
      return;
    }
    if (cape) {
      cape.t += dt;
      var p = Math.min(1, cape.t / cape.dur);
      var lift = Math.sin(p * Math.PI);
      player.x = cape.fromX + lift * 42;
      player.y = cape.fromY - lift * 30;
      player.facing = "right";
      player.phase += dt * 11;
      stepAcc += dt;
      if (stepAcc > 0.34) {
        stepAcc = 0;
        playFoot();
      }
      player.pose = frankFrame(true);
      if (p >= 1) {
        player.x = cape.fromX;
        player.y = cape.fromY;
        cape = null;
        capeDone = true;
        persist();
        var ptero = null;
        AREAS.hollow.creatures.forEach(function (c) {
          if (c.id === "pterosaur") ptero = c;
        });
        if (ptero) showHello(ptero, true);
      }
      return;
    }
    var ax = 0;
    var ay = 0;
    if (!journalOpen && !mapOpen) {
      if (hasDir("left")) ax -= 1;
      if (hasDir("right")) ax += 1;
      if (hasDir("up")) ay -= 1;
      if (hasDir("down")) ay += 1;
    }
    if (ax === 0 && ay === 0 && !heldKeys.size && !heldTouch.size && finger && !journalOpen && !mapOpen) {
      var dx = finger.x - player.x;
      var dy = finger.y - player.y;
      var dist = Math.hypot(dx, dy);
      if (dist > 26) {
        ax = dx / dist;
        ay = dy / dist;
      }
    }
    var moving = ax !== 0 || ay !== 0;
    if (moving) {
      var len = Math.hypot(ax, ay);
      ax /= len;
      ay /= len;
      if (ax > 0) player.facing = "right";
      else if (ax < 0) player.facing = "left";
      player.phase += dt * 11;
      stepAcc += dt;
      if (stepAcc > 0.34) {
        stepAcc = 0;
        playFoot();
      }
      var nx = player.x + ax * SPEED * dt;
      var ny = player.y + ay * SPEED * dt;
      if (!hits(nx, player.y)) player.x = nx;
      if (!hits(player.x, ny)) player.y = ny;
    }
    var area = areaNow();
    player.pose = frankFrame(moving);
    player.x = clamp(player.x, 28, area.w - 28);
    player.y = clamp(player.y, 28, area.h - 28);
    for (var i = 0; i < area.exits.length; i++) {
      var ex = area.exits[i];
      if (ex.to === "museum" && !capeDone) continue;
      if (ex.side === "east" || ex.side === "west") {
        if (player.y <= ex.y0 || player.y >= ex.y1) continue;
        if (ex.side === "east" && player.x > area.w - 46) { beginGate(ex); break; }
        if (ex.side === "west" && player.x < 46) { beginGate(ex); break; }
      } else if (ex.side === "north" || ex.side === "south") {
        if (player.x <= ex.x0 || player.x >= ex.x1) continue;
        if (ex.side === "north" && player.y < 46) { beginGate(ex); break; }
        if (ex.side === "south" && player.y > area.h - 46) { beginGate(ex); break; }
      }
    }
    if (area.blooms) {
      area.blooms.forEach(function (b) {
        if (picked.has(b.id)) return;
        if (Math.hypot(b.x - player.x, b.y - player.y) < 110) {
          picked.add(b.id);
          persist();
          if (journalOpen) renderJournal();
        }
      });
    }
    maybeEnding();
    updateMeet();
    sayShutDoor(area);
    stepSave += dt;
    if (stepSave > 1.6) {
      stepSave = 0;
      persist();
    }
  }

  var stepSave = 0;

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    if (titleOn) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#cfe6b0";
      ctx.fillRect(0, 0, viewW, viewH);
    } else if (gateWalk) drawGateWalk(now);
    else drawWorld(now);
    requestAnimationFrame(frame);
  }
  if (window.speechSynthesis && window.speechSynthesis.getVoices) {
    window.speechSynthesis.getVoices();
  }
  var titleScreen = document.getElementById("titleScreen");
  var newGameBtn = document.getElementById("newGame");
  var continueBtn = document.getElementById("continueGame");
  var muteBtn = document.getElementById("muteBtn");

  function paintMute() {
    muteBtn.textContent = muted ? "Muted" : "Sound";
    muteBtn.setAttribute("aria-pressed", muted ? "true" : "false");
  }

  function enterGame() {
    titleOn = false;
    titleScreen.hidden = true;
    placeName.textContent = areaNow().title;
    stage.style.background = areaNow().ground;
    snap = true;
    shownId = null;
    meet.hidden = true;
    persist();
    startMusic();
    paintHud();
    renderPlaceList();
  }

  function paintContinue() {
    var ok = hasContinue();
    continueBtn.disabled = !ok;
  }

  paintMute();
  paintContinue();

  newGameBtn.addEventListener("click", function () {
    if (!window.confirm("Start a new game? This empties the journal.")) return;
    audio();
    seen.clear();
    picked.clear();
    endingDone = false;
    endingOn = false;
    cape = null;
    capeDone = false;
    gateWalk = null;
    ORDER.forEach(function (id) {
      AREAS[id].creatures.forEach(function (c) { c.clearing = null; });
    });
    player.area = "garden";
    player.x = 160;
    player.y = PATH_Y;
    player.facing = "right";
    player.pose = "idle";
    enterGame();
  });

  continueBtn.addEventListener("click", function () {
    if (!hasContinue()) return;
    audio();
    var data = stored;
    seen.clear();
    picked.clear();
    (data.seen || []).forEach(function (id) { seen.add(id); });
    (data.flowers || []).forEach(function (id) { picked.add(id); });
    endingDone = !!data.endingDone;
    endingOn = false;
    player.area = AREAS[data.area] ? data.area : "garden";
    player.x = typeof data.x === "number" ? data.x : 160;
    player.y = typeof data.y === "number" ? data.y : PATH_Y;
    if (!insideMaze(areaNow(), player.x, player.y)) {
      var home = areaNow().home || { x: 220, y: 920 };
      player.x = home.x;
      player.y = home.y;
    }
    player.facing = data.facing === "left" ? "left" : "right";
    capeDone = !!data.capeDone;
    cape = null;
    gateWalk = null;
    muted = !!data.mute;
    paintMute();
    enterGame();
  });

  muteBtn.addEventListener("click", function () {
    muted = !muted;
    paintMute();
    if (muted) stopMusic();
    else {
      audio();
      startMusic();
    }
    persist();
  });

  titleScreen.addEventListener("pointerdown", function () {
    if (!muted && !musicOn) startMusic();
  });

  requestAnimationFrame(frame);

  window.__sf = {
    state: function () {
      return {
        area: player.area,
        x: Math.round(player.x),
        y: Math.round(player.y),
        facing: player.facing,
        pose: player.pose || "idle",
        seen: Array.from(seen),
        ready: imagesReady,
        meet: meet.hidden ? "" : meetName.textContent,
        ask: meet.hidden ? "" : meetAsk.textContent,
        word: meet.hidden ? "" : meetWord.textContent,
        tag: meet.hidden ? "" : meetTag.textContent,
        journal: journalOpen,
        phase: quiz ? quiz.phase : "",
        listen: !listenBtn.hidden,
        slots: slotsEl.childElementCount,
        choices: choicesEl.textContent,
        clearing: (function () {
          var id = "";
          ORDER.forEach(function (areaId) {
            AREAS[areaId].creatures.forEach(function (c) { if (c.clearing) id = c.id; });
          });
          return id;
        })(),
        cape: cape ? "play" : (capeDone ? "done" : ""),
        limit: areaNow().w,
        title: titleOn,
        muted: muted,
        music: musicOn,
        gate: gateWalk ? "play" : ""
      };
    },
    hitsAt: function (x, y) { return hits(x, y); },
    friends: function () {
      return areaNow().creatures.map(function (c) { return { id: c.id, x: c.x, y: c.y }; });
    },
    corridors: function () {
      var area = areaNow();
      return (area.corridors || []).map(function (r) { return { x: r.x, y: r.y, w: r.w, h: r.h }; });
    },
    place: function (id, x, y) {
      if (!AREAS[id]) return;
      player.area = id;
      player.x = x;
      player.y = y;
      titleOn = false;
      titleScreen.hidden = true;
      placeName.textContent = AREAS[id].title;
      stage.style.background = AREAS[id].ground;
      renderPlaceList();
    },
    paintWorld: function (id) {
      var area = AREAS[id];
      var prev = { area: player.area, x: player.x, y: player.y, vw: viewW, vh: viewH, d: dpr };
      var off = document.createElement("canvas");
      off.width = area.w;
      off.height = area.h;
      var saved = ctx;
      player.area = id;
      player.x = area.w / 2;
      player.y = area.h / 2;
      viewW = area.w;
      viewH = area.h;
      dpr = 1;
      ctx = off.getContext("2d");
      drawWorld(0);
      ctx = saved;
      player.area = prev.area;
      player.x = prev.x;
      player.y = prev.y;
      viewW = prev.vw;
      viewH = prev.vh;
      dpr = prev.d;
      return off;
    }
  };
})();
</script>
</body>
</html>
